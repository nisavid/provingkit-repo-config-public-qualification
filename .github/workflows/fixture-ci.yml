name: Fixture CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixture-ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fixture-ci:
    name: fixture-ci
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'nisavid/qualification/skipped-required-check' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
      - name: Set up CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          architecture: x64
          check-latest: false
          cache: ""
      - name: Verify the project runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(python --version)" = "Python 3.14.6"
      - name: Install hash-pinned validation dependencies
        shell: bash
        run: |
          python -m pip install --no-cache-dir --require-hashes --only-binary=:all: -r requirements.txt
      - name: Exercise the catalog renderer
        shell: bash
        run: |
          set -euo pipefail
          output="$(python -m fixture_catalog plugins/demo/catalog.json)"
          test "$output" = "hello: Hello fixture"
      - name: Validate the catalog content contract
        shell: bash
        run: python scripts/validate_catalog.py plugins/demo
      - name: Run command-line behavior tests
        shell: bash
        run: python -m unittest discover -s tests -v
